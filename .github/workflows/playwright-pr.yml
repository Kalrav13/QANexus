name: Playwright PR (Smoke)

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: playwright-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke-chromium:
    name: Smoke · Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      TEST_ENV: qa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare environment file
        run: cp .env.qa.example .env.qa

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run smoke tests (Chromium)
        run: >
          npx playwright test
          --grep @smoke
          --project=setup
          --project=smoke
          --project=chromium
          --project=chromium-login
          --project=api

      - name: Generate Allure report
        if: always()
        run: npx allure-commandline@latest generate allure-results --clean -o reports/allure-report

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-playwright-html-report
          path: reports/html-report
          retention-days: 7
          if-no-files-found: warn

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-junit-report
          path: reports/junit.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-allure-report
          path: reports/allure-report
          retention-days: 7
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-playwright-test-results
          path: reports/test-results
          retention-days: 7
          if-no-files-found: warn
