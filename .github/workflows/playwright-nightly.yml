name: Playwright Nightly (Regression)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-nightly
  cancel-in-progress: false

jobs:
  regression-cross-browser:
    name: Regression · All browsers
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: true
      TEST_ENV: qa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare environment file
        run: cp .env.qa.example .env.qa

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run full regression suite (all projects, all browsers)
        run: npm test

      - name: Generate Allure report
        if: always()
        run: npx allure-commandline@latest generate allure-results --clean -o reports/allure-report

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-html-report
          path: reports/html-report
          retention-days: 14
          if-no-files-found: warn

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-junit-report
          path: reports/junit.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-allure-results
          path: allure-results
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-allure-report
          path: reports/allure-report
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-test-results
          path: reports/test-results
          retention-days: 14
          if-no-files-found: warn
